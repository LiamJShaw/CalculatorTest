<main class="page">
  <header class="page-header">
    <h1>Calculator Test</h1>
    <button
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="'Switch to ' + (theme() === 'light' ? 'dark' : 'light') + ' mode'"
    >
      @if (theme() === 'light') {
        Dark mode
      } @else {
        Light mode
      }
    </button>
  </header>

  <app-modal />
</main>
